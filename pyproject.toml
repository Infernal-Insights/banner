[project]
name = "banner"
version = "0.1.0"
description = "Reference loop for Banner. Point a machine at a charter and earn sway by finishing a task another node can recompute."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[project.scripts]
banner = "banner.cli:main"

[tool.setuptools.packages.find]
include = ["banner*"]
